name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HW1-125264/HW1-125264

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests and coverage gate
        id: tests
        continue-on-error: true
        run: mvn -B verify

      - name: Generate coverage report
        if: always() && steps.tests.outcome != 'cancelled'
        continue-on-error: true
        run: mvn -B jacoco:report

      - name: SonarCloud analysis
        if: always() && steps.tests.outcome != 'cancelled'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=HW1-125264
          -Dsonar.projectName='HW1-125264'
          -Dsonar.organization=luispcneri
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Fail on test or coverage failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
