spring.application.name=HW1-125264

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tuttibox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tutti}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tutti_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
